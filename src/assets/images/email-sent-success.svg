<svg
  width="160"
  height="160"
  viewBox="0 0 160 160"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Cadastro concluído com sucesso"
>
  <!-- Círculo de fundo suave -->
  <circle
    cx="80"
    cy="80"
    r="70"
    fill="#2e2d88"
    fill-opacity="0.05"
    stroke="#2e2d88"
    stroke-width="2"
  />

  <!-- Sombra do cartão -->
  <rect
    x="32"
    y="38"
    width="96"
    height="76"
    rx="12"
    fill="#2e2d88"
    fill-opacity="0.03"
  />

  <!-- Cartão principal (calendário) -->
  <rect
    x="30"
    y="36"
    width="88"
    height="72"
    rx="10"
    fill="white"
    stroke="#2e2d88"
    stroke-width="2"
  />

  <!-- Barra superior do calendário -->
  <rect
    x="30"
    y="36"
    width="88"
    height="20"
    rx="10"
    fill="#2e2d88"
    fill-opacity="0.06"
  />

  <!-- Argolinhas do calendário -->
  <line
    x1="46"
    y1="30"
    x2="46"
    y2="40"
    stroke="#2e2d88"
    stroke-width="3"
    stroke-linecap="round"
  />
  <line
    x1="72"
    y1="30"
    x2="72"
    y2="40"
    stroke="#2e2d88"
    stroke-width="3"
    stroke-linecap="round"
  />
  <line
    x1="98"
    y1="30"
    x2="98"
    y2="40"
    stroke="#2e2d88"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Linhas de “dias” no calendário -->
  <line
    x1="40"
    y1="66"
    x2="108"
    y2="66"
    stroke="#2e2d88"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-opacity="0.7"
  />
  <line
    x1="40"
    y1="80"
    x2="92"
    y2="80"
    stroke="#2e2d88"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-opacity="0.5"
  />
  <line
    x1="40"
    y1="94"
    x2="84"
    y2="94"
    stroke="#2e2d88"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-opacity="0.5"
  />

  <!-- Círculo do check (badge) -->
  <circle
    cx="108"
    cy="98"
    r="24"
    fill="white"
    stroke="#2e2d88"
    stroke-width="2.5"
  />

  <!-- Ícone de check -->
  <path
    d="M98 98 L106 106 L120 92"
    fill="none"
    stroke="#2e2d88"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Detalhe de destaque (brilho) no badge -->
  <path
    d="M96 88 C100 84 104 82 110 82"
    fill="none"
    stroke="#2e2d88"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-opacity="0.5"
  />
</svg>
