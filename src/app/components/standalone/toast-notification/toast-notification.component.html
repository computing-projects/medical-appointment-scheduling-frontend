<div class="toast-container" *ngIf="toasts.length > 0">
  <div
    *ngFor="let toast of toasts"
    class="toast"
    [class]="'toast--' + toast.type"
    (click)="removeToast(toast.id)">
    <div class="toast__icon">{{ getIcon(toast.type) }}</div>
    <div class="toast__message">{{ toast.message }}</div>
    <button class="toast__close" (click)="removeToast(toast.id); $event.stopPropagation()" aria-label="Fechar">
      <span>✕</span>
    </button>
  </div>
</div>
